<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github_Issue_Tracker | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- added daisy+tailwind cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font add  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- fave icon -->
     <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>

</head>

<body>
    <header>
        <div
            class="navbar bg-base-100 shadow-sm px-1 md:px-10 md:flex md:justify-between block justify-center items-center">
            <div class="grid grid-cols-1 md:grid-cols-2 my-5">
                <a class="btn btn-ghost text-xl">
                    <img class="w-10" src="./assets/github-logo.png" alt="">
                    <h1>GitHub Issues Tracker</h1>
                </a>
            </div>
            <div class="flex gap-2 justify-center items-center px-8">
                <input id="input-search" type="text" placeholder="Search Issues..." class="input input-bordered w-full md:w-auto" />
                <div class="dropdown dropdown-end">
                    <div>
                        <button id="btn-search" class="btn btn-primary">Search</button>
                    </div>

                </div>
            </div>
        </div>
    </header>

    <main>
       
        <section class="w-11/12 mx-auto mt-12">
            <div id="allBtnContainer" class="bg-base-200 p-5 space-x-5 rounded-xl">
                <button class="btn btn-nav btn-primary">All</button>
                <button class="btn btn-nav">Open</button>
                <button class="btn btn-nav">Closed</button>
            </div>
        </section>

        <section class="w-11/12 mx-auto mt-10">
            <div id="lessonCountContainer"
                class=" flex justify-between bg-base-200 p-5 items-center rounded-xl">
                <div class="lesson-left flex gap-3">
                    <img class="w-10 h-10 rounded-full" src="./assets/Aperture.png" alt="">
                    <div>
                        <h1 class="text-xl font-bold"><span id="issueCount">0</span> Issue</h1>
                        <p class="text-gray-400 font-semibold">Track and manage your project issues</p>
                    </div>
                </div>

                <div class="lesson-right flex justify-center items-center">
                    <div class="my-5">
                        <span class="rounded-full bg-green-500"><i class="fa-regular fa-circle"></i></span>
                        <span class="mr-2">Open</span>
                    </div>
                    <div>
                        <span class="rounded-full bg-purple-500"><i class="fa-regular fa-circle"></i></span>
                        <span>Closed</span>
                    </div>
                </div>
            </div>
        </section>

        
        <section id="spinner" class="flex justify-center items-center mt-8 hidden">
            <span class="loading loading-spinner loading-xl"></span>
        </section>

       
        <section id="issue-container" class="w-11/12 mx-auto mt-10">
            <div id="all-issues-container" class=" grid grid-cols-4 gap-5 bg-base-200 rounded-xl p-8">
             
            </div>
            <div id="open-issues-container"
                class="hidde grid grid-cols-4 gap-5 bg-base-200 rounded-xl p-8"></div>

            <div id="closed-issues-container"
                class="hidden grid grid-cols-4 gap-5 bg-base-200 rounded-xl p-8"></div>
        </section>

     
        <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">
                <div id="details-container" class="space-y-5">

                </div>
                <div class="modal-action">
                    <form method="dialog">
                        
                        <button class="btn btn-primary px-5">Close</button>
                    </form>
                </div>
            </div>
        </dialog>

    </main>

    <script src="./script.js"></script>

</body>

</html>
