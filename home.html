<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github_Issue_Tracker | Home</title>

    <!-- tailwind && daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font awsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />




    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>





</head>

<body>
    <div class="bg-bage-200 shadow-sm flex justify-between p-5">
        <div class="flex items-center gap-2">
            <img src="./assets/github-logo.png" class="w-10" alt="">
            <h1>GitHub Issues Tracker</h1>

        </div>
        <div class="flex gap-2 justify-center items-center px-8">
            <div>
                <input type="text" class="input inpur-bordered w-full" name="" id="input-search  "
                    placeholder="Search issues...">
            </div>
            <button id="btn-search" class="btn btn-primary">New Issue </button>

        </div>

    </div>

    <section class="w-11/12 mx-auto mt-12">
        <div id="allBtnContainer" class="bg-base-200 p-5 space-s-5 rounded-lg">
            <button class="btn btn-nav btn-primary py-2 px-5">All</button>
            <button class="btn btn-nav py-2 px-5">Open</button>
            <button class="btn bt-nav py-2 px-5">Closed</button>
        </div>

    </section>


    <section class="w-11/12 mx-auto mt-6">

        <div class="bg-base-200 p-5 rounded-lg flex justify-between items-center">
            <div class="flex gap-2">
                <img src="./assets/Aperture.png" alt="" class="w-10 h-10 bg-gray-400 rounded-full">
                <div>
                    <h1 class="bold text-2xl">50 Issues</h1>
                    <p class="text-gray-500">Track and manage your project issues</p>
                </div>
            </div>

            <div>
                <div class="flex gap-4">
                    <div class="my-5">
                        <span class="rounded-full bg-green-500"><i class="fa-regular fa-circle"></i></span>
                        <span>Open</span>

                    </div>
                    <div class="my-5">
                        <span class="rounded-full bg-purple-500"><i class="fa-regular fa-circle"></i></span>
                        <span>Closed</span>

                    </div>
                    <div>

                    </div>
                </div>





            </div>








    </section>

    <section id="issue-container" class="w-11/12 mx-auto mt-10">
        <div id="all-issues-container" class="grid grid-cols-4 rounded-xl p-8">
            <div class="bg-white rounded-xl p-5 border-t-4 border-t-green-500 space-y-4">
                <div class="flex justify-between">
                    <img src="./assets/Open-Status.png" alt="">
                    <p class="bg-red-100 px-3 rounded-xl border border-red-400 font-medium">High</p>

                </div>


                <h1 class="text-2xl font-semibold">Fix naviaition menu on mobile devices</h1>
                <p>The navigation menu doesn't collapse properly on mobile devices...</p>
                <div class="flex gap-3 items-center">
                    <p class="bg-red-100 text-red-500  px-1 rounded-lg border border-red-500"> <i
                            class="fa-solid fa-bug"></i>
                        BUG</p>
                    <p class="bg-yellow-100 text-yellow-500  px-1 rounded-lg border border-yellow-400"> <i
                            class="fa-solid fa-life-ring"></i> HELP WANTED</p>

                </div>
                <br>

                <hr class="text-gray-300"> <br>
                <p class="text-gray-400">#1bY JOHN_doe</p>
                <p class="text-gray-400">1/15/2024</p>

            </div>

        </div>
          <div id="open-issues-container"
                class="hidden grid grid-cols-1 md:grid-cols-4 gap-5 bg-base-200 rounded-xl p-8"></div>

            <div id="closed-issues-container"
                class="hidden grid grid-cols-1 md:grid-cols-4 gap-5 bg-base-200 rounded-xl p-8"></div>

        </div>




    </section>











</body>

</html>
